name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (worker)
        run: cd worker && npm install
      - name: Install (client)
        run: cd client && npm install
      - name: Typecheck and test (worker)
        run: cd worker && npm run typecheck && npm test
      # The test pool runs the Worker under a Node shim, so a dependency that
      # only works in Node passes every test and then fails to boot on
      # Cloudflare. This starts the real runtime and checks it answers.
      - name: Verify the Worker boots on the Cloudflare runtime
        run: cd worker && npm run verify:runtime
      - name: Typecheck, build and test (client)
        run: cd client && npm run build && npm test
