# Deploys the Worker (API) and the Pages site (client) on every push to main.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts:Edit", "Workers R2 Storage:Edit",
#                          "Cloudflare Pages:Edit" and "Account Settings:Read"
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
# Repository variables (same page, "Variables" tab):
#   API_URL                the Worker URL, e.g. https://private-messenger.<account>.workers.dev
#   PAGES_PROJECT          the Pages project name, e.g. private-messenger
#
# Worker secrets (VAPID keys, bootstrap invite) are set once with
# `wrangler secret put`, not here. See README.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd worker && npm install --legacy-peer-deps
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  pages:
    runs-on: ubuntu-latest
    needs: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd client && npm install --legacy-peer-deps
      - name: Build client
        run: cd client && npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=${{ vars.PAGES_PROJECT }} --commit-dirty=true
