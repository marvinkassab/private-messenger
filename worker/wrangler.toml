name = "private-messenger"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Anything set in the Cloudflare dashboard survives a deploy: the secrets
# below, and the R2 binding if it is bound there rather than here.
keep_vars = true

# Where the client is served from. Edit this to your Pages URL and push; the
# deploy follows the push. A browser origin not listed here is refused by
# CORS, so the app would load and then fail to reach the server.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[durable_objects]
bindings = [
  { name = "MAILBOX", class_name = "Mailbox" },
  { name = "INVITE", class_name = "Invite" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Invite"]

# Attachment storage. The binding stays optional in code, so removing these
# three lines disables photos rather than breaking the deploy.
#
# This is a stepping stone. Attachments are moving inside the message queue
# itself, where they are deleted on delivery like every other message, which
# leaves nothing accumulating here at all. Once that lands this bucket can be
# deleted.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "private-messenger-attachments"

# Secrets live only in the Cloudflare dashboard, never in this repository:
#   VAPID_PUBLIC_KEY   VAPID_PRIVATE_KEY   VAPID_SUBJECT   BOOTSTRAP_INVITE
# Settings -> Variables and Secrets -> Add, type Secret. `keep_vars` above
# means a deploy leaves them alone.
